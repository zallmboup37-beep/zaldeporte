<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Zalsport — envoi du guide</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0A0B0E;color:#F4F6F8;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.c{width:100%;max-width:440px;background:rgba(255,255,255,.04);border-radius:20px;padding:24px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
h1{font-size:20px;margin:0 0 6px}p{color:#C9CFD7;font-size:14px;line-height:1.5;margin:0 0 16px}
label{display:block;font-size:13px;color:#C9CFD7;margin:14px 0 6px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:#14161B;color:#fff;font-size:15px}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:999px;background:#C9F227;color:#0A0B0E;font-weight:800;font-size:15px;cursor:pointer}
button:disabled{opacity:.5}#m{margin-top:16px;font-size:14px;line-height:1.5}.ok{color:#C9F227}.err{color:#ff8a8a}
</style></head><body><div class="c">
<h1>Envoyer le guide (PDF)</h1>
<p>Le PDF est rangé dans un stockage <b>privé</b> : il n'a aucune adresse publique. Les acheteurs ne le reçoivent qu'après un paiement vérifié.</p>
<label for="k">Mot de passe admin</label><input id="k" type="password" autocomplete="current-password">
<label for="f">Fichier PDF</label><input id="f" type="file" accept="application/pdf">
<button id="go">Envoyer</button><button id="chk" style="background:#2a2d35;color:#fff">Vérifier ce qui est stocké</button>
<div id="m"></div></div>
<script>
const $=i=>document.getElementById(i),m=(t,c)=>{$('m').className=c||'';$('m').textContent=t};
const H=()=>({'x-admin-key':$('k').value});
$('go').onclick=async()=>{const f=$('f').files[0];if(!$('k').value)return m('Entre le mot de passe.','err');if(!f)return m('Choisis le PDF.','err');
 $('go').disabled=true;m('Envoi en cours…');
 try{const r=await fetch('/api/guide-upload',{method:'POST',headers:H(),body:f});const j=await r.json().catch(()=>({}));
  if(r.ok)m('✓ PDF enregistré ('+Math.round(j.bytes/1024)+' Ko).','ok');
  else m(r.status===401?'Mot de passe incorrect.':r.status===503?'Mot de passe pas encore configuré sur Netlify.':r.status===415?'Ce fichier n\'est pas un PDF.':r.status===413?'Fichier trop gros (max 5 Mo).':'Erreur ('+r.status+').','err')}
 catch(e){m('Erreur réseau.','err')}$('go').disabled=false};
$('chk').onclick=async()=>{if(!$('k').value)return m('Entre le mot de passe.','err');
 try{const r=await fetch('/api/guide-upload',{headers:H()});const j=await r.json().catch(()=>({}));
  if(!r.ok)return m(r.status===401?'Mot de passe incorrect.':'Erreur ('+r.status+').','err');
  m(j.present?'✓ Un PDF est stocké ('+Math.round((j.bytes||0)/1024)+' Ko, envoyé le '+(j.uploaded||'?')+').':'Aucun PDF stocké pour l\'instant.',j.present?'ok':'err')}
 catch(e){m('Erreur réseau.','err')}};
</script></body></html>
